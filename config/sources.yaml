# Data source endpoints and feature flags.
#
# Every source can be disabled independently. A disabled or unreachable source
# degrades the site gracefully: its panels render an "unavailable" state and
# health.json records why, rather than failing the whole run. The one thing
# that is never optional is the privacy layer.

cluster_name: "dsicluster"

privacy:
  # Minimum distinct users before a group may be named publicly.
  # Below this, the bucket merges into "Other". Do not lower this without
  # thinking hard about who a 2-person bucket actually identifies.
  k_anonymity: 3
  # Recompute this many trailing days on every run. sacct records settle late:
  # jobs still running at snapshot time, and slurmdbd accounting lag.
  resettle_days: 7

sources:
  slurm:
    enabled: true
    # sacct/sreport run as subprocesses; the container needs slurm.conf + munge.
    sacct_bin: sacct
    sreport_bin: sreport
    sinfo_bin: sinfo
    # Chunk backfill queries. A multi-year sacct range will hammer slurmdbd.
    backfill_chunk_days: 7
    # Ceiling on how long a single job can plausibly have run, in hours.
    #
    # Why this is needed: a job that was RUNNING when the controller lost track
    # of it never receives an End time, and sacct then reports ElapsedRaw as
    # (now - start), which grows without bound. Three such records from
    # 2024-03-28 were setting the site's "longest job" record at 20,663 hours
    # (861 days) and its "largest job" record at 30,259 GPU-hours.
    #
    # The value is NOT the 12h that `general` allows. Partition MaxTime differs
    # per partition and `Monsoon` permits 3-00:00:00, so a 72h job is legitimate
    # today. 96h is Monsoon's limit plus headroom, which discards the absurd
    # without discarding real long jobs or guessing at historical limits.
    # Raise it if a partition limit ever exceeds this; set to 0 to disable.
    max_job_hours: 96
    # States counted as "the job ran and finished on purpose".
    success_states: [COMPLETED]
    # Everything else is bucketed by name: FAILED, TIMEOUT, OUT_OF_MEMORY,
    # CANCELLED, NODE_FAIL, PREEMPTED.

  storage:
    # DISABLED 2026-08-06: `ssh root@builder.cs.uchicago.edu` is refused
    # (Permission denied (publickey,password)) from both a laptop and fe01, so
    # the zfs hop below cannot run and every dataset degrades to unavailable.
    # Left configured, not deleted — flip back to true once the collector runs
    # somewhere holding a key that builder accepts for root.
    enabled: false
    # Root on the storage nodes is reachable from builder, not from fe0x
    # (permitted_root_nets). Set ssh_via to the jump host accordingly.
    ssh_via: "builder.cs.uchicago.edu"
    ssh_user: root
    timeout_seconds: 60

  directory:
    enabled: true
    # Derived 2026-07-29 (imp-73k) from what the cluster nodes themselves use,
    # which is authoritative over any hand-entered value: puppet-modules
    # code/hiera/common.yaml sets ldap_integration::nss_method: sssd and
    # ldap_integration::nss::sssd::ldap_server: ldap.cs.uchicago.edu, and every
    # DSI node (fe0x, dsi_cluster*) applies the ldap_integration class. The
    # rendered sssd.conf (common/ldap_integration/templates/sssd.conf.erb) is
    # the exact source of the values below.
    #
    # There is NO separate ds.uchicago.edu LDAP — the DSI cluster authenticates
    # against the CS directory.
    ldap_uri: "ldaps://ldap.cs.uchicago.edu"
    # Users and groups do not share an efficient search base in this directory,
    # so each search gets its own. These mirror the cluster's own sssd.conf
    # (ldap_user_search_base / ldap_group_search_base). The group base is a
    # descendant of the user base, so a single shared base returns complete
    # results — it just walks the entire university subtree for every group
    # lookup. sssd's scope/filter suffix ("?subtree?(CSAccount=TRUE)") is
    # deliberately NOT part of these values: they must be plain DNs, and the
    # filters live in user_filter / group_filter below.
    user_base_dn: dc=uchicago,dc=edu
    group_base_dn: ou=group,dc=cs,dc=uchicago,dc=edu
    # Fallback used for both searches when the two keys above are absent.
    # Older configs that set only base_dn keep working unchanged.
    base_dn: null
    # An account on this cluster is one the CS directory marks CSAccount=TRUE.
    # Filtering on objectClass=posixAccount ALONE over dc=uchicago,dc=edu would
    # sweep in university accounts that have no access here and inflate the
    # "active accounts" figure, so both conditions are required.
    user_filter: "(&(objectClass=posixAccount)(CSAccount=TRUE))"
    group_filter: "(objectClass=posixGroup)"
    foreman_url: https://builder.cs.uchicago.edu
    # Credentials come from the environment, never from this file:
    #   CLUSTER_IMPACT_LDAP_BIND_DN / CLUSTER_IMPACT_LDAP_BIND_PW
    #   CLUSTER_IMPACT_FOREMAN_USER / CLUSTER_IMPACT_FOREMAN_TOKEN
    #
    # LDAP: leave both LDAP vars UNSET. Anonymous read is sufficient for the
    # attributes we need (uid, uidNumber, cn, memberUid) — confirmed 2026-07-29
    # (imp-73k). We count accounts and group membership; we never read
    # userPassword or any private attribute. So the collector deploys with no
    # LDAP credential at all, which is one fewer secret on the collector host
    # and one fewer thing that can leak from a public repo's tooling. If a
    # future change needs a bound search, that is a decision to re-make, not a
    # variable to quietly fill in.

  prometheus:
    # DISABLED 2026-08-06 — this answers imp-aey, and the answer is NO.
    # `curl http://s10.cs.uchicago.edu:9090/-/ready` times out from BOTH a
    # laptop and fe01, confirming the firewall permits only s10 -> fe01:8181 and
    # not the reverse. Everything Prometheus-derived (node availability, storage
    # I/O throughput) is therefore unavailable until the reverse path is opened
    # in Puppet by CS techstaff, or the collector proxies through a DSI host.
    # The endpoint below is correct and verified; only reachability is missing.
    enabled: false
    # Verified live 2026-07-29 (imp-ux6): Prometheus 2.50.1, 1y retention,
    # Puppet-managed on bare-metal s10 (prometheus::manage_prometheus_server in
    # puppet-modules hiera; port 9090 opened by role/techstaff_access).
    #
    # NOTE: graf.ds.uchicago.edu is NOT Grafana and not a Prometheus proxy — it
    # is an nginx page on virt02 that JS-redirects to CS-owned
    # graf.cs.uchicago.edu. Talk to Prometheus directly, as we do here.
    #
    # OPEN: s10 is a CS-owned host (128.135.164.216) and the collector runs in
    # podman on fe0x. The known firewall rule only permits s10 -> fe01:8181,
    # not the reverse, so reachability from the collector is UNCONFIRMED.
    # `cli.py doctor` will report this; one curl from a frontend node settles it.
    url: "http://s10.cs.uchicago.edu:9090"
    step: "5m"
    queries:
      node_up: 'up{job="node"}'
      net_rx_bytes: 'rate(node_network_receive_bytes_total{device!~"lo|veth.*"}[5m])'
      net_tx_bytes: 'rate(node_network_transmit_bytes_total{device!~"lo|veth.*"}[5m])'
      disk_read_bytes: 'rate(node_disk_read_bytes_total[5m])'
      disk_write_bytes: 'rate(node_disk_written_bytes_total[5m])'
      # Storage node I/O.
      #
      # These previously filtered on job="storage", which DOES NOT EXIST in this
      # Prometheus — verified against the live label-values API (imp-ux6), so the
      # queries silently returned nothing. The storage nodes appear under
      # job="node" (direct scrape :9100) and job="node_dsi_proxy" (via PushProx
      # at 128.135.24.43:8080, more reliable behind the DSI network boundary).
      #
      # An instance-regex filter is used rather than job="node_dsi_proxy" because
      # that job also carries compute nodes; matching the hostname is precise.
      storage_read_bytes: 'rate(node_disk_read_bytes_total{instance=~"cluster-storage[0-9]+\.ds\.uchicago\.edu.*"}[5m])'
      storage_write_bytes: 'rate(node_disk_written_bytes_total{instance=~"cluster-storage[0-9]+\.ds\.uchicago\.edu.*"}[5m])'
      # Unverified alternative: node_exporter's ZFS collector may expose
      # node_zfs_pool_io_read_bytes_total / _write_bytes_total, which are
      # pool-level rather than block-device-level. Check before switching:
      #   curl -sG http://s10.cs.uchicago.edu:9090/api/v1/query \
      #     --data-urlencode 'query=node_zfs_pool_io_read_bytes_total'

  dcgm:
    # OFF until the DCGM exporters are deployed. The code path and the site
    # panels both exist already; flipping this to true is the whole rollout.
    # Until then the site says "allocated", never "utilized", because
    # allocation is all Slurm can actually tell us.
    enabled: false
    queries:
      sm_active: 'DCGM_FI_PROF_SM_ACTIVE'
      gpu_util: 'DCGM_FI_DEV_GPU_UTIL'
      mem_used: 'DCGM_FI_DEV_FB_USED'
      power_watts: 'DCGM_FI_DEV_POWER_USAGE'

publish:
  repo_dir: "/repo"
  data_dir: "data"
  summary_path: "_data/summary.json"
  branch: "main"
  commit_author: "cluster-impact bot <techstaff@ds.uchicago.edu>"
  # Only these paths may ever be committed by the collector.
  allowed_paths:
    - "data/"
    - "_data/summary.json"
  rebase_retries: 3
